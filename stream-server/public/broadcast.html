<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/theme.css" />
<script>(function(){try{var t=localStorage.getItem('spl_theme');var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t==='light'?'light':t==='dark'?'dark':(d?'dark':'light'));}catch(e){}})();</script>
<title>网页开播 · 流式频传输</title>
<style>
  :root {
    --bg:#0b0e14; --panel:#141a24; --line:#232c3b; --text:#e6edf6; --muted:#8b98ab;
    --accent:#2f81f7; --ok:#2ea043; --err:#f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100%;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }
  .logo i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .logo i.on { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  header nav { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  header nav a { color: var(--muted); font-size: 13px; text-decoration: none; }
  header nav a:hover { color: var(--text); }
  .status { font-size: 12px; color: var(--muted); margin-left: 6px; }

  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    gap: 18px; padding: 18px 20px 26px; max-width: 1180px; width: 100%; margin: 0 auto;
    min-height: 0; align-items: start;
  }

  /* ---------------- 预览 ---------------- */
  .stage {
    background: #05070c; border: 1px solid var(--line); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
    aspect-ratio: 16 / 9; max-height: calc(100vh - 130px); width: 100%;
  }
  .stage video { width: 100%; height: 100%; object-fit: contain; display: none; }
  .stage.live video { display: block; }
  .stage .ph { text-align: center; color: var(--muted); font-size: 13px; line-height: 2; }
  .stage .ph svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 8px; }
  .stage.live .ph { display: none; }
  /* 直播中角标 */
  .badge {
    position: absolute; top: 12px; left: 12px; display: none; align-items: center; gap: 6px;
    background: rgba(20,26,36,.82); border: 1px solid rgba(255,255,255,.16); border-radius: 99px;
    padding: 5px 11px; font-size: 11.5px; color: #e6edf6; backdrop-filter: blur(6px);
  }
  .stage.live .badge { display: flex; }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--err); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .stats {
    position: absolute; left: 12px; bottom: 12px; display: none; gap: 14px;
    background: rgba(20,26,36,.82); border: 1px solid rgba(255,255,255,.16); border-radius: 10px;
    padding: 8px 12px; font-size: 11.5px; color: #a9b6c9; backdrop-filter: blur(6px);
  }
  .stage.live .stats { display: flex; }
  .stats b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------------- 设置面板 ---------------- */
  .panel { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .box h2 { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .8px; margin: 0 0 12px; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field select {
    width: 100%; font: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; color: var(--text); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .check input { accent-color: var(--accent); }

  .go {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .go:hover { background: #3d8bfd; }
  .go.stop { background: transparent; border-color: var(--err); color: var(--err); }
  .go.stop:hover { background: rgba(248,81,73,.1); }
  .go[disabled] { opacity: .55; cursor: default; }
  .tip { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-top: 10px; }
  .tip.err { color: var(--err); }
  .tip.ok { color: var(--ok); }

  /* 未登录遮罩 */
  .gate {
    position: fixed; inset: 0; background: rgba(4,7,12,.72); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .gate.on { display: flex; }
  .gate .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px;
    max-width: 360px; text-align: center;
  }
  .gate h3 { margin: 0 0 8px; font-size: 17px; }
  .gate p { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.8; }
  .gate a {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 10px 22px; border-radius: 9px;
  }
  .gate .sub { margin-top: 14px; font-size: 12px; }
  .gate .sub a { background: none; color: var(--muted); padding: 0; font-weight: 400; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; padding: 14px; }
    .stage { aspect-ratio: 16/10; min-height: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><i id="dot"></i>流式频传输 · 网页开播</div>
  <nav>
    <span class="status" id="status">摄像头未开启</span>
    <a href="/">下载客户端</a>
    <a href="/watch.html">网页观看</a>
  </nav>
</header>

<main>
  <div class="stage" id="stage">
    <div class="ph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="2.5" y="6" width="14" height="12" rx="2.5" />
        <path d="M16.5 10.5l5-3v9l-5-3z" />
      </svg>
      <div>点击右侧「开始直播」调用摄像头</div>
    </div>
    <video id="preview" playsinline muted autoplay></video>
    <div class="badge"><i></i>直播中</div>
    <div class="stats">
      <span>观看 <b id="sViewers">0</b></span>
      <span>帧率 <b id="sFps">0</b></span>
      <span>码率 <b id="sKbps">0</b> kbps</span>
      <span>已发 <b id="sFrames">0</b> 帧</span>
    </div>
  </div>

  <div class="panel">
    <div class="box">
      <h2>直播设置</h2>
      <div class="field">
        <label for="room">房间号</label>
        <div class="row">
          <input id="room" type="text" maxlength="12" inputmode="numeric" placeholder="4-12 位数字" />
          <button id="rand" style="flex:0 0 auto;width:auto;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer">随机</button>
        </div>
      </div>
      <div class="field">
        <label for="nick">昵称（选填）</label>
        <input id="nick" type="text" maxlength="20" placeholder="显示在观看端" />
      </div>
      <div class="field">
        <label for="device">摄像头</label>
        <select id="device"><option value="">默认摄像头</option></select>
      </div>
      <div class="field">
        <label>画面与帧率</label>
        <div class="row">
          <select id="res">
            <option value="640x480">640 × 480</option>
            <option value="1280x720" selected>1280 × 720</option>
            <option value="1920x1080">1920 × 1080</option>
          </select>
          <select id="fps">
            <option value="10">10 fps</option>
            <option value="15" selected>15 fps</option>
            <option value="24">24 fps</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="quality">画质 <span id="qVal" style="color:var(--text)">65</span></label>
        <input id="quality" type="range" min="35" max="88" value="65" step="1" />
      </div>
      <div class="field">
        <label class="check"><input id="mirror" type="checkbox" checked /> 前置镜像（仅预览）</label>
      </div>
      <button class="go" id="toggle">开始直播</button>
      <div class="tip" id="tip">开播需登录；观众打开 <code>/watch.html</code> 输入房间号即可观看。</div>
    </div>
  </div>
</main>

<div class="gate" id="gate">
  <div class="card">
    <h3>开播需要登录</h3>
    <p>登录后即可用摄像头开播，房间号与观看端共用。</p>
    <a id="loginLink" href="/login.html">去登录</a>
    <div class="sub"><a href="/">先随便逛逛</a></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TOKEN_KEY = 'spl_token';

  var ws = null, stream = null, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
  var running = false, timer = null, statTimer = null, frames = 0, bytes = 0, fpsTick = 0, fpsCount = 0, busy = false;
  var startedAt = 0, lastStats = 0;

  function token() { return localStorage.getItem(TOKEN_KEY) || ''; }
  function randRoom() { return String(Math.floor(1000 + Math.random() * 9000)); }
  function setTip(text, kind) {
    var el = $('tip'); el.className = 'tip' + (kind ? ' ' + kind : ''); el.textContent = text;
  }
  function setStatus(text, live) {
    $('status').textContent = text;
    $('dot').className = live ? 'on' : '';
  }

  $('room').value = randRoom();
  $('rand').onclick = function () { $('room').value = randRoom(); };
  $('quality').oninput = function () { $('qVal').textContent = this.value; };
  $('mirror').onchange = function () {
    $('preview').style.transform = this.checked ? 'scaleX(-1)' : 'none';
  };
  $('preview').style.transform = $('mirror').checked ? 'scaleX(-1)' : 'none';

  // 摄像头列表（首次授权后才有 label）
  async function listDevices() {
    try {
      var list = await navigator.mediaDevices.enumerateDevices();
      var cams = list.filter(function (d) { return d.kind === 'videoinput'; });
      var sel = $('device');
      sel.innerHTML = '<option value="">默认摄像头</option>' + cams.map(function (c, i) {
        return '<option value="' + c.deviceId + '">' + (c.label || ('摄像头 ' + (i + 1))) + '</option>';
      }).join('');
    } catch (e) { /* ignore */ }
  }
  listDevices();
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', listDevices);
  }

  function constraints() {
    var res = $('res').value.split('x');
    var fps = parseInt($('fps').value, 10) || 15;
    var c = {
      audio: false,
      video: {
        width: { ideal: parseInt(res[0], 10) },
        height: { ideal: parseInt(res[1], 10) },
        frameRate: { ideal: fps, max: fps },
      },
    };
    var dev = $('device').value;
    if (dev) c.video.deviceId = { exact: dev };
    return c;
  }

  async function openCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('当前浏览器不支持摄像头采集，请使用 Chrome / Edge / Safari 新版');
    }
    stream = await navigator.mediaDevices.getUserMedia(constraints());
    var v = $('preview');
    v.srcObject = stream;
    await v.play().catch(function () {});
    canvas.width = v.videoWidth || 1280;
    canvas.height = v.videoHeight || 720;
    $('stage').classList.add('live');
    listDevices();
  }

  function closeCamera() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
    $('preview').srcObject = null;
    $('stage').classList.remove('live');
  }

  function connect(room) {
    return new Promise(function (resolve, reject) {
      var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(proto + location.host + '/ws');
      ws.binaryType = 'arraybuffer';
      var settled = false;

      ws.onopen = function () {
        ws.send(JSON.stringify({
          type: 'join', room: room, role: 'sender',
          name: $('nick').value.trim() || '网页主播',
          title: $('nick').value.trim() || '',
          token: token(),
        }));
      };
      ws.onmessage = function (ev) {
        if (typeof ev.data !== 'string') return;
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'joined') {
          settled = true;
          $('sViewers').textContent = m.receivers || 0;
          resolve(m);
        } else if (m.type === 'error') {
          if (!settled) { settled = true; reject(new Error(m.message || '加入房间失败')); }
          else setTip(m.message || '发生错误', 'err');
        } else if (m.type === 'stats') {
          $('sViewers').textContent = m.receivers || 0;
        }
      };
      ws.onclose = function () {
        if (!settled) { settled = true; reject(new Error('连接服务器失败')); return; }
        if (running) { setTip('与服务器的连接已断开，直播已停止', 'err'); stop('disconnected'); }
      };
      ws.onerror = function () { /* onclose 统一处理 */ };
    });
  }

  function sendMeta() {
    ws.send(JSON.stringify({
      type: 'meta', width: canvas.width, height: canvas.height,
      fps: parseInt($('fps').value, 10) || 15, quality: parseInt($('quality').value, 10), codec: 'jpeg',
    }));
  }

  function pump() {
    if (!running || !ws || ws.readyState !== 1 || busy) return;
    var v = $('preview');
    if (!v.videoWidth) return;

    if (canvas.width !== v.videoWidth || canvas.height !== v.videoHeight) {
      canvas.width = v.videoWidth; canvas.height = v.videoHeight;
      sendMeta();
    }

    busy = true;
    var q = parseInt($('quality').value, 10) / 100;
    ctx.save();
    if ($('mirror').checked) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    canvas.toBlob(function (blob) {
      busy = false;
      if (!blob || !running || !ws || ws.readyState !== 1) return;
      blob.arrayBuffer().then(function (buf) {
        if (!running || !ws || ws.readyState !== 1) return;
        ws.send(buf);
        frames++; bytes += buf.byteLength; fpsCount++;
        $('sFrames').textContent = frames;
      }).catch(function () {});
    }, 'image/jpeg', q);
  }

  async function start() {
    if (running) return;
    if (!token()) { $('gate').classList.add('on'); return; }
    var room = $('room').value.trim();
    if (!/^\d{4,12}$/.test(room)) return setTip('房间号建议用 4-12 位数字，方便观众输入', 'err');

    $('toggle').disabled = true;
    setTip('正在打开摄像头…');
    try {
      await openCamera();
    } catch (e) {
      $('toggle').disabled = false;
      var msg = e && e.name === 'NotAllowedError' ? '摄像头权限被拒绝，请在浏览器地址栏允许后重试' : (e.message || '打开摄像头失败');
      setTip(msg, 'err');
      return;
    }

    setTip('正在连接服务器…');
    try {
      await connect(room);
    } catch (e) {
      closeCamera();
      $('toggle').disabled = false;
      if (/登录/.test(e.message)) { $('gate').classList.add('on'); return; }
      setTip(e.message || '连接失败', 'err');
      return;
    }

    running = true;
    startedAt = Date.now();
    frames = 0; bytes = 0; fpsCount = 0; fpsTick = Date.now();
    $('toggle').disabled = false;
    $('toggle').textContent = '结束直播';
    $('toggle').classList.add('stop');
    $('room').disabled = true;
    $('device').disabled = true;
    $('res').disabled = true;
    setStatus('直播中 · 房间 ' + room, true);
    setTip('已开播，把房间号 ' + room + ' 发给观众即可观看', 'ok');
    sendMeta();

    var interval = Math.round(1000 / (parseInt($('fps').value, 10) || 15));
    timer = setInterval(pump, Math.max(40, interval));

    statTimer = setInterval(function () {
      if (!running) return;      var now = Date.now();
      var dt = (now - fpsTick) / 1000;
      if (dt >= 1) {
        $('sFps').textContent = Math.round(fpsCount / dt);
        $('sKbps').textContent = Math.round(bytes * 8 / dt / 1000);
        fpsCount = 0; bytes = 0; fpsTick = now;
        var sec = Math.floor((now - startedAt) / 1000);
        var mm = String(Math.floor(sec / 60)).padStart(2, '0');
        var ss = String(sec % 60).padStart(2, '0');
        $('status').textContent = '直播中 ' + mm + ':' + ss + ' · 房间 ' + $('room').value.trim();
      }
    }, 1000);
  }

  function stop(reason) {
    if (!running && !ws && !stream) return;
    running = false;
    if (timer) { clearInterval(timer); timer = null; }
    if (statTimer) { clearInterval(statTimer); statTimer = null; }
    if (ws && ws.readyState === 1) { try { ws.close(); } catch (e) { /* ignore */ } }
    ws = null;
    closeCamera();
    $('toggle').textContent = '开始直播';
    $('toggle').classList.remove('stop');
    $('toggle').disabled = false;
    $('room').disabled = false;
    $('device').disabled = false;
    $('res').disabled = false;
    $('sFps').textContent = '0'; $('sKbps').textContent = '0'; $('sViewers').textContent = '0';
    setStatus(reason === 'disconnected' ? '连接已断开' : '摄像头未开启', false);
    if (reason !== 'disconnected' && reason !== 'leave') setTip('直播已结束');
  }

  $('toggle').onclick = function () { running ? stop() : start(); };

  // 离开页面务必停止采集，避免摄像头指示灯常亮
  window.addEventListener('pagehide', function () { stop('leave'); });
  window.addEventListener('beforeunload', function () { stop('leave'); });

  // 未登录直接提示，但允许先浏览
  if (!token()) {
    $('loginLink').href = '/login.html?next=' + encodeURIComponent('/broadcast.html');
    setTip('开播需要登录账号，点击「开始直播」会提示登录', '');
  }
})();
</script>
</body>
</html>
